# ANAGEM: PostgreSQL + Spring Boot API + Angular SSR web + nginx edge.
# Usage:  cp .env.example .env   (set DB_PASSWORD and JWT_SECRET)   &&   docker compose up -d --build
# Then open http://localhost:${HTTP_PORT:-80}  (public site)  and  /admin  (dashboard).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: anagem
      POSTGRES_USER: anagem
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anagem -d anagem"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"   # loopback only, for backups and maintenance

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/anagem
      DB_USER: anagem
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 random characters)}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${PUBLIC_BASE_URL:-http://localhost}}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    volumes:
      - media:/data/storage
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"   # loopback only (debugging, local ng serve); visitors reach the API through the edge

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_ORIGIN: http://backend:8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      # Host names the site answers to (Angular rejects other Host headers). Include every public domain.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - backend
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  pgdata:
  media:
