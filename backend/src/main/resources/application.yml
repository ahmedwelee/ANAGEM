server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: anagem-cms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/anagem}
    username: ${DB_USER:anagem}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    placeholder-replacement: false
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 62MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: 60m
    issuer: anagem-cms
  storage:
    root-dir: ${STORAGE_DIR:./storage}
    max-image-size: 8MB
    max-pdf-size: 50MB
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: Super administrateur
  rate-limit:
    login-per-minute: 10
    contact-per-minute: 5
