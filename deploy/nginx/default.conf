# Edge proxy: /api goes to the Spring Boot backend, everything else to the Angular SSR server.
# TLS is expected to be terminated in front of this container (hosting load balancer, Caddy, Traefik, Cloudflare ...);
# see docs/deployment.md for a TLS server block if nginx must do it.
# Docker's embedded DNS, asked again every few seconds: rebuilding or restarting `web` / `backend` (new container address)
# does not need an nginx restart. Using variables in proxy_pass is what makes nginx re-resolve.
resolver 127.0.0.11 valid=5s ipv6=off;

# Re-use the scheme given by a TLS terminator in front of us; fall back to our own.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Media uploads (images and PDFs): the backend enforces the real limits per file type.
    client_max_body_size 64m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;

    # Only the API is reachable from outside: no /actuator, no /swagger-ui.html, no /v3/api-docs.
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;      # no URI part: the request path is passed unchanged
        proxy_read_timeout 60s;
    }

    location / {
        set $web_upstream http://web:4000;
        proxy_pass $web_upstream;
        proxy_read_timeout 30s;
    }
}
